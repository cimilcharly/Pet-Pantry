<!DOCTYPE html>
<html lang="en">

<head>
          {% load static %}

    <meta charset="utf-8">
    <title>PET SHOP - Pet Shop Website Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link href="{% static 'img/favicon.ico' %}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Roboto:wght@700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/flaticon/font/flaticon.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>
<!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg bg-white navbar-light shadow-sm py-3 py-lg-0 px-3 px-lg-0">
        <a href="index" class="navbar-brand ms-lg-5">
            <h1 class="m-0 text-uppercase text-dark"><i class="bi bi-shop fs-1 text-primary me-3"></i>Hi {{request.session.admin}}</h1>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto py-0">
                <a href="admin_h" class="nav-item nav-link ">Home</a>
                <a href="viewuser" class="nav-item nav-link">User</a>
                <a href="viewdb" class="nav-item nav-link ">Employee</a>
                <a href="addproduct" class="nav-item nav-link active">Add Product</a>
                <a href="manageproduct" class="nav-item nav-link">Manage Product</a>
                <a href="orderdetails" class="nav-item nav-link ">Order Details</a>
                <a href="logout" class="nav-item nav-link ">Log Out</a>


                <a href="contact" class="nav-item nav-link nav-contact bg-primary text-white px-5 ms-lg-5">Contact <i class="bi bi-arrow-right"></i></a>
            </div>
        </div>
    </nav>
    <!-- Navbar End -->

<!-- Contact Start -->
    <div class="container-fluid pt-5">
        <div class="container">
            <div class="border-start border-5 border-primary ps-5 mb-5" style="max-width: 600px;">

                <h1 class="display-5 text-uppercase mb-0">Add Product</h1>
            </div>
            <div class="row g-5">
                <div class="col-lg-7">
                    <form id="request" class="main_form" action="" method="post" enctype="multipart/form-data">

                      {% csrf_token %}

                        <div class="row g-3">
                            <div class="col-12">
                                <input type="text" class="form-control bg-light border-0 px-4" placeholder="Product name" name='Product_name' style="height: 55px;">
                            </div>
                            <div class="col-12">
                                <input type="text" class="form-control bg-light border-0 px-4" placeholder="Price" name='Price' style="height: 55px;">
                            </div>
                            <div class="col-12">
                                <input type="text" class="form-control bg-light border-0 px-4" placeholder="stock" name='Stock' style="height: 55px;">
                            </div>
                            <div class="col-12">
                                <input type="file" class="form-control bg-light border-0 px-4" placeholder="image" name='img' style="height: 55px;">
                            </div>
                            <div class="col-12">
                                <button class="send_btn" style="height: 40px;background:#73B028;color:white" type="submit">ADD</button>
                            </div>

                        </div>
                    </form>
                </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
