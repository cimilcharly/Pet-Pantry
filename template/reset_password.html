<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="utf-8">
    <title>Reset Password - Pet Pantry</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Pet Password Reset" name="keywords">
    <meta content="Reset your Pet Pantry account password" name="description">

    <!-- Favicon -->
    <link href="{% static 'img/favicon.ico' %}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Roboto:wght@700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/flaticon/font/flaticon.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Bootstrap and Main Stylesheet -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>
    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg bg-white navbar-light shadow-sm py-3 px-3 mb-5">
        <a href="/" class="navbar-brand">
            <h1 class="m-0 text-uppercase text-dark">
                <i class="bi bi-shop fs-1 text-primary me-3"></i>PET PANTRY
            </h1>
        </a>
    </nav>
    <!-- Navbar End -->

    <!-- Reset Password Start -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="bg-light p-5 rounded shadow">
                    <h2 class="text-center mb-4">Reset Password</h2>
                    <form action="" method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="newpassword" class="form-label">New Password</label>
                            <input type="password" name="newpassword" class="form-control" id="newpassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="cpassword" class="form-label">Confirm Password</label>
                            <input type="password" name="cpassword" class="form-control" id="cpassword" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Reset Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Reset Password End -->

    <!-- Footer Start -->
    <div class="container-fluid bg-dark text-white-50 py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; <a class="text-white" href="#">Pet Pantry</a>. All Rights Reserved.</p>
        </div>
    </div>
    <!-- Footer End -->

    <!-- JS Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>

    <!-- Custom JS -->
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
